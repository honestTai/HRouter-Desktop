name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use the stable vX.Y.Z format: $tag"
          }
          $tagVersion = $tag.Substring(1)
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoMatch = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1
          $cargoVersion = $cargoMatch.Matches[0].Groups[1].Value
          $versions = @($tagVersion, $packageVersion, $tauriVersion, $cargoVersion) | Select-Object -Unique
          if ($versions.Count -ne 1) {
            throw "Release versions do not match: tag=$tagVersion package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        shell: pwsh
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and publish signed updater
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HRouter Desktop v__VERSION__"
          releaseBody: |
            HRouter Desktop v__VERSION__

            - 新增系统原生 PTY 终端工作区，支持 Windows ConPTY 与 macOS 登录 Shell，并可多开独立窗口。
            - HRouter 外部链接可正常打开新窗口，不再被内置页面拦截。
            - Agent CLI 安装时若缺少 npm，会先安装 Node.js/npm 再继续。
            - Codex 支持完整 config.toml 编辑、Goal 模式、远程压缩和自定义上下文配置。
            - Profile 切换器展示 Provider、MCP 与 Skill 摘要，查找和切换更直观。
            - 合入 CC Switch 的 Windows CLI 检测、WSL 写入、启动闪屏和升级预检修复，同时保留 HRouter 独有能力。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          tauriScript: pnpm tauri
          args: --bundles nsis

      - name: Rewrite updater manifest to public download URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $manifestDir = Join-Path $env:RUNNER_TEMP "hrouter-updater-manifest"
          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null
          gh release download $tag --pattern latest.json --dir $manifestDir --clobber

          $manifestPath = Join-Path $manifestDir "latest.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $release = gh release view $tag --json assets | ConvertFrom-Json
          $expectedPrefix = "https://github.com/${{ github.repository }}/releases/download/$tag/"

          foreach ($platform in $manifest.platforms.PSObject.Properties) {
            $matches = @($release.assets | Where-Object apiUrl -eq $platform.Value.url)
            if ($matches.Count -ne 1) {
              throw "Could not map updater asset URL for $($platform.Name): $($platform.Value.url)"
            }
            # Draft releases expose temporary untagged URLs. Build the stable URL
            # from the matched asset name before publishing the release.
            $assetName = [Uri]::EscapeDataString($matches[0].name)
            $platform.Value.url = "$expectedPrefix$assetName"
            if (-not $platform.Value.url.StartsWith($expectedPrefix)) {
              throw "Unexpected public updater URL for $($platform.Name): $($platform.Value.url)"
            }
          }

          $json = $manifest | ConvertTo-Json -Depth 10
          [IO.File]::WriteAllText(
            $manifestPath,
            "$json`n",
            [Text.UTF8Encoding]::new($false)
          )
          gh release upload $tag $manifestPath --clobber

      - name: Validate updater manifest and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $manifestDir = Join-Path $env:RUNNER_TEMP "hrouter-updater-manifest-verify"
          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null
          gh release download $tag --pattern latest.json --dir $manifestDir --clobber

          $manifest = Get-Content (Join-Path $manifestDir "latest.json") -Raw | ConvertFrom-Json
          $expectedVersion = $tag.Substring(1)
          $expectedPrefix = "https://github.com/${{ github.repository }}/releases/download/$tag/"
          if ($manifest.version -ne $expectedVersion) {
            throw "Unexpected updater version: $($manifest.version)"
          }
          foreach ($platform in $manifest.platforms.PSObject.Properties) {
            if (-not $platform.Value.url.StartsWith($expectedPrefix)) {
              throw "Updater URL is not public for $($platform.Name): $($platform.Value.url)"
            }
            if ([string]::IsNullOrWhiteSpace($platform.Value.signature)) {
              throw "Updater signature is missing for $($platform.Name)"
            }
          }

          gh release edit $tag --draft=false
